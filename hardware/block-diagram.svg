<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
<title id="title">ESP32-S3 Vehicle Health Computer — system wiring</title><desc id="desc">OBD CAN pins 6 and 14 connect to a 3.3 volt SN65HVD230 transceiver. GPIO11 sends TX and GPIO13 receives RX. OBD pin16 supplies a fused protected buck to the board 5 volt input. Pins4 and5 share the documented ground reference. Wi-Fi links to a local browser.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto-start-reverse"><path d="M0 0L8 3L0 6Z" fill="context-stroke"/></marker><style>text{font-family:Arial,sans-serif;fill:#e8edf5}.title{font-size:32px;font-weight:bold}.h{font-size:23px;font-weight:bold}.t{font-size:18px}.s{font-size:16px;fill:#b5c8da}.box{fill:#15263b;stroke:#405771;stroke-width:2;rx:16}.can{stroke:#54d9bb;stroke-width:3;fill:none}.power{stroke:#ffca78;stroke-width:3;fill:none}.logic{stroke:#87b8ff;stroke-width:3;fill:none}.ground{stroke:#a9b4c4;stroke-width:2;stroke-dasharray:6 5;fill:none}</style></defs>
<rect width="1400" height="960" fill="#0b1422"/>
<text x="50" y="62" class="title">Vehicle Health Computer</text><text x="50" y="95" class="t">ESP32-S3 · built-in TWAI · external 3.3 V CAN transceiver · no MCP2515</text>
<rect x="50" y="160" width="250" height="390" class="box"/><text x="75" y="202" class="h">Vehicle OBD-II</text>
<text x="75" y="263" class="t">Pin 6 · CAN-H</text><text x="75" y="313" class="t">Pin 14 · CAN-L</text><text x="75" y="403" class="t">Pin 16 · battery +12 V</text><text x="75" y="483" class="t">Pin 4 · chassis GND</text><text x="75" y="519" class="t">Pin 5 · signal GND</text>
<rect x="430" y="160" width="320" height="210" class="box"/><text x="455" y="202" class="h">SN65HVD230 module</text><text x="455" y="233" class="s">Physical CAN transceiver · 3.3 V</text><text x="455" y="265" class="t">CANH</text><text x="455" y="315" class="t">CANL</text><text x="660" y="265" class="t">D / TXD</text><text x="660" y="315" class="t">R / RXD</text><text x="455" y="348" class="s">RS → GND · local 100 nF decoupling</text>
<path d="M300 258H430M300 308H430" class="can"/><text x="318" y="242" class="s">Twisted pair</text>
<rect x="970" y="160" width="370" height="390" class="box"/><text x="995" y="202" class="h">ESP32-S3 board</text><text x="995" y="233" class="s">Internal TWAI / classic CAN controller</text><text x="995" y="265" class="t">GPIO11 · TX output</text><text x="995" y="315" class="t">GPIO13 · RX input</text><text x="995" y="403" class="t">Documented 5 V input</text><text x="995" y="453" class="t">3V3 regulator output</text><text x="995" y="510" class="t">GND · common reference</text>
<path d="M970 258H750" class="logic" marker-end="url(#arrow)"/><path d="M750 308H970" class="logic" marker-end="url(#arrow)"/><text x="791" y="242" class="s">3.3 V logic</text>
<rect x="430" y="405" width="360" height="145" class="box"/><text x="450" y="438" class="h">Protected power stage</text><text x="450" y="469" class="s">Fuse → reverse-polarity protection</text><text x="450" y="497" class="s">→ surge/filter network → 5 V buck</text><text x="450" y="525" class="s">Engineered assembly; see hardware.md</text>
<path d="M300 398H365V450H430" class="power" marker-end="url(#arrow)"/><path d="M790 450H880V398H970" class="power" marker-end="url(#arrow)"/><text x="817" y="430" class="s">5 V</text>
<path d="M970 448H920V130H590V160" class="power" marker-end="url(#arrow)"/><text x="640" y="123" class="s">3.3 V to transceiver VCC</text>
<path d="M300 480H345V600H1150V550M300 515H345M590 370V390H400V600M610 550V600" class="ground"/><text x="470" y="626" class="s">Common ground network · buck return to pin 4 · confirm pin 5 reference connection</text>
<rect x="970" y="650" width="370" height="130" class="box"/><text x="995" y="688" class="h">Phone / laptop browser</text><text x="995" y="721" class="t">Wi-Fi AP + captive portal assistance</text><text x="995" y="752" class="s">http://192.168.4.1 · local dashboard</text><path d="M1275 550V650" class="logic" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="1290" y="600" class="s">Wi-Fi</text>
<rect x="50" y="665" width="840" height="115" rx="12" fill="#242b32"/><text x="75" y="699" class="t">No extra 120 Ω termination on an existing vehicle bus.</text><text x="75" y="728" class="t">Verify connector pin numbers; plug and socket views can be mirrored.</text><text x="75" y="757" class="t">Disconnect vehicle power before USB programming or wiring changes.</text>
<path d="M50 827H1350" stroke="#405771"/><text x="50" y="864" class="h">Prototype wiring diagram — not a fabrication-ready or automotive-qualified schematic</text><text x="50" y="897" class="s">Default demo does not start CAN. Active diagnostics send read requests. Test parked, attended, and disconnect afterward.</text><text x="50" y="928" class="s">Power protection ratings, CAN protection, exact board pinout and USB backfeed behavior require verification before vehicle use.</text>
</svg>
